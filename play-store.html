<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grazie | SpotMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: #080b12;
      color: #e5e7eb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    .box {
      width: min(620px, 95%);
      border: 1px solid #243046;
      background: #111827;
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 1.7rem;
    }
    p {
      color: #cdd4de;
    }
    a {
      display: inline-block;
      margin-top: 0.5rem;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="box">
    <section id="join-list" class="section join">
      <div class="container join-wrap">
        <div style="text-align: center;">
          <h2>Entra nella waitlist di SpotMe</h2>
          <p>
            Lascia la tua email per sapere quando smetterai di girare a vuoto.
          </p>
        </div>

        <form class="join-form" name="spotme-join-list" method="POST" data-netlify="true" netlify-honeypot="bot-field"
          action="/thank-you.html" netlify>
          <input type="hidden" name="form-name" value="spotme-join-list" />
          <p class="hidden">
            <label>Non compilare questo campo: <input name="bot-field" /></label>
          </p>

          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <input id="email" name="email" type="email" placeholder="Inserisci la tue email..." required
              autocomplete="email" />

            <button type="submit" class="btn btn-primary" data-umami-event="waitlist-submit">
              Unisciti
            </button>
          </div>
          <p class="form-note">
            Niente spam: ti scriveremo solo quando l'applicazione sarà disponibile.
          </p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
